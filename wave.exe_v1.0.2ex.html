<!-- wave.exe v1.0.2ex -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>wave.exe v1.0.2ex</title>

<style>

:root{
    --bg:#ffffff;
    --fg:#000000;
    --border:#000000;
    --font:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

@media (prefers-color-scheme:dark){
    :root{
        --bg:#000000;
        --fg:#ffffff;
        --border:#ffffff;
    }
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--fg);
    font:14px/1.6 var(--font);
}

body{
    padding:32px;
}

main{
    max-width:640px;
    margin:0 auto;
}

header{
    margin-bottom:2rem;
}

header h1{
    font-size:1rem;
    font-weight:400;
}

header h1::before{
    content:"[ ";
}

header h1::after{
    content:" ]";
}

section{
    margin-bottom:1.5rem;
}

label{
    display:block;
    margin-bottom:.5rem;
}

input,
select{
    width:100%;
    background:transparent;
    color:var(--fg);
    border:1px solid var(--border);
    padding:.5rem;
    font:inherit;
}

input[type=number]{
    text-align:right;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:.75rem;
    margin-top:2rem;
}

button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--fg);
    cursor:pointer;
    font:inherit;
}

button::before{
    content:"[ ";
}

button::after{
    content:" ]";
}

button:hover{
    text-decoration:underline;
}

button:disabled{
    opacity:.35;
    text-decoration:none;
    cursor:default;
}

.info{
    margin-top:2rem;
    white-space:pre-wrap;
}

hr{
    border:none;
    border-top:1px solid var(--border);
    margin:2rem 0;
}

::selection{
    background:var(--fg);
    color:var(--bg);
}

</style>

</head>
<body>

<main>

<header>
<h1>wave.exe v1.0.2ex</h1>
</header>

<section>

<label for="mode">
Tone Type
</label>

<select id="mode">
<option value="binaural">Binaural</option>
<option value="monaural">Monaural</option>
<option value="isochronic">Isochronic</option>
</select>

</section>

<section>

<label for="carrier">
Carrier Frequency (Hz)
</label>

<input
id="carrier"
type="number"
min="20"
max="20000"
step="0.001"
value="220.00">

</section>

<section>

<label for="beat">
Beat Frequency (Hz)
</label>

<input
id="beat"
type="number"
min="0.01"
max="100.00"
step="0.001"
value="4.00">

</section>

<section>

<label for="duration">
Export Length (seconds)
</label>

<input
id="duration"
type="number"
min="1"
step="1"
value="300">

</section>

<hr>

<div class="buttons">

<button id="play">
Play
</button>

<button id="stop" disabled>
Stop
</button>

<button id="export">
Export WAV
</button>

</div>

<output
id="status"
class="info">
Ready.
</output>

</main>
