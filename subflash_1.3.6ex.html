<!-- subflash 1.3.6ex -->

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>subflash 1.3.5</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff;
  --fg:#000000;
  --border:#000000;
  --muted: color-mix(in srgb, var(--fg) 60%, transparent);
  --panel: transparent;
  --focus: currentColor;
  --radius: 0;
  --font: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark){
:root{
--bg:#000000;
--fg:#ffffff;
--border:#ffffff;
}
}

*{
box-sizing:border-box;
}

html,body{
min-height:100%;
margin:0;
background:var(--bg);
color:var(--fg);
font:14px/1.5 var(--font);
}

body{
/*padding:24px;*/
  margin:20px;
}

main{
max-width:1100px;
margin:0 auto;
}

header{
margin-bottom:1rem;
}

h1{
margin:0;
font-size:1rem;
font-weight:400;
letter-spacing:.02em;
}

h1::before{ content:"[ "; }
h1::after{ content:" ]"; }

.top-transport{
display:flex;
flex-wrap:wrap;
gap:.75rem;
align-items:center;
margin-bottom:1.25rem;
padding:.75rem 0 1rem;
border-bottom:1px solid var(--border);
}

.grid{
display:grid;
gap:1rem;
}

@media (min-width: 900px){
.grid{
grid-template-columns: 1fr 1fr;
}
}

section{
border:1px solid var(--border);
padding:1rem;
background:var(--panel);
}

section h2{
margin:0 0 .75rem 0;
font-size:1rem;
font-weight:400;
}

section h2::before{ content:"[ "; }
section h2::after{ content:" ]"; }

label{
display:block;
margin:0 0 .35rem 0;
}

input, select, textarea{
width:100%;
border:1px solid var(--border);
background:transparent;
color:var(--fg);
font:inherit;
border-radius:0;
padding:.55rem .65rem;
}

textarea{
min-height:10rem;
resize:vertical;
}

input[type="number"]{
text-align:right;
}

input[type="file"]{
padding:.4rem .55rem;
}

input[type="color"]{
height:2.35rem;
padding:.2rem;
}

input[type="range"]{
width:100%;
padding:0;
border:none;
background:transparent;
accent-color:var(--fg);
}

.controls{
display:grid;
gap:.75rem;
}

.row{
display:grid;
gap:.75rem;
}

@media (min-width: 700px){
.row.two{
grid-template-columns: 1fr 1fr;
}
.row.three{
grid-template-columns: 1fr 1fr 1fr;
}
}

.transport{
display:grid;
gap:.65rem;
margin-top:.85rem;
}

.transport-top{
display:flex;
flex-wrap:wrap;
gap:.75rem;
align-items:center;
}

button{
appearance:none;
border:none;
background:transparent;
color:var(--fg);
padding:0;
font:inherit;
cursor:pointer;
line-height:1.5;
}

button::before{ content:"[ "; }
button::after{ content:" ]"; }

button:hover{
text-decoration:underline;
}

button:disabled{
opacity:.35;
cursor:default;
text-decoration:none;
}

.small{
color:var(--muted);
font-size:.92em;
}

.range-wrap{
display:grid;
gap:.35rem;
}

.media-shell{
display:grid;
gap:.75rem;
}

.video-stage{
position:relative;
width:100%;
}

video{
width:100%;
max-height:360px;
background:#000;
border:1px solid var(--border);
display:block;
object-fit:contain;
}

.video-stage:fullscreen{
width:100vw;
height:100vh;
max-width:none;
max-height:none;
background:#000;
overflow:hidden;
}

.video-stage:fullscreen video{
width:100%;
height:100%;
max-width:none;
max-height:none;
border:none;
object-fit:contain;
}

.video-stage:fullscreen .flash-layer{
position:absolute;
inset:0;
}

.flash-layer{
position:absolute;
inset:0;
z-index:9999;
display:grid;
place-items:center;
opacity:0;
pointer-events:none;
transition:opacity 80ms linear;
}

.flash-layer.active{
opacity:1;
}

.flash-text{
text-align:center;
padding:2rem;
max-width:min(92vw, 60rem);
font-size:clamp(1.75rem, 5vw, 5rem);
line-height:1.1;
letter-spacing:.01em;
font-weight:400;
text-wrap:balance;
word-break:break-word;
}

audio{
width:100%;
display:none;
}

.flash-settings{
display:grid;
gap:.75rem;
}

.swatch{
display:grid;
gap:.35rem;
min-width:160px;
flex:1 1 160px;
}

.status{
margin-top:1rem;
white-space:pre-wrap;
min-height:2.5em;
}

::selection{
background:var(--fg);
color:var(--bg);
} </style>

</head>
<body>
<main>
  <header>
    <h1>subflash 1.3.5</h1>
  </header>

  <div class="top-transport">
    <button id="masterStartBtn">Start</button>
    <button id="masterPauseBtn">Pause</button>
    <button id="masterStopBtn">Stop</button>
  </div>

  <div class="grid">
    <section class="media-shell">
      <h2>Video</h2>
      <div class="controls">
        <div>
          <label for="videoFile">Video file</label>
          <input id="videoFile" type="file" accept="video/*" />
        </div>
    <div id="videoStage" class="video-stage">
      <video id="video" playsinline preload="metadata"></video>
      <div id="flashLayer" class="flash-layer" aria-hidden="true">
        <div id="flashText" class="flash-text"></div>
      </div>
    </div>

    <div class="transport">
      <div class="transport-top">
        <button id="videoPlayBtn" disabled>Play</button>
        <button id="videoStopBtn" disabled>Stop</button>
        <button id="videoFullscreenBtn">Fullscreen</button>
        <span id="videoTime" class="small">0:00.000 / 0:00.000</span>
      </div>

      <div class="range-wrap">
        <label for="videoScrub">Scrubber</label>
        <input id="videoScrub" type="range" min="0" max="0" step="0.001" value="0" disabled />
      </div>

      <div class="range-wrap">
        <label for="videoVolume">Video volume</label>
        <input id="videoVolume" type="range" min="0" max="100" step="1" value="100" />
      </div>
    </div>
  </div>
</section>

<section class="media-shell">
  <h2>Audio</h2>
  <div class="controls">
    <div>
      <label for="audioFile">Audio file</label>
      <input id="audioFile" type="file" accept="audio/*" />
    </div>

    <audio id="audio" preload="metadata"></audio>

    <div class="transport">
      <div class="transport-top">
        <button id="audioPlayBtn" disabled>Play</button>
        <button id="audioStopBtn" disabled>Stop</button>
        <span id="audioTime" class="small">0:00.000 / 0:00.000</span>
        <span id="audioCount" class="small">Plays/loops: 0</span>
      </div>

      <div class="range-wrap">
        <label for="audioScrub">Scrubber</label>
        <input id="audioScrub" type="range" min="0" max="0" step="0.001" value="0" disabled />
      </div>

      <div class="range-wrap">
        <label for="audioVolume">Audio volume</label>
        <input id="audioVolume" type="range" min="0" max="100" step="1" value="100" />
      </div>
    </div>
  </div>
</section>

<section class="media-shell">
  <h2>Affirmations</h2>
  <div class="controls">
    <div>
      <label for="affirmations">Text affirmations</label>
      <textarea id="affirmations" spellcheck="false" placeholder="One sentence per line, or several sentences separated by punctuation."></textarea>
    </div>

    <div class="transport-top">
      <button id="updateAffirmationsBtn">Update affirmations</button>
      <span class="small">Used during playback and flashes.</span>
    </div>
  </div>
</section>

<section class="media-shell">
  <h2>Flash settings</h2>
  <div class="flash-settings">
    <div class="row three">
      <div>
        <label for="burstCount">Quick flashes</label>
        <select id="burstCount">
          <option value="1">1 flash</option>
          <option value="2">2 flashes</option>
          <option value="3">3 flashes</option>
          <option value="random" selected>Random</option>
        </select>
      </div>

      <div>
        <label for="intervalMode">Interval mode</label>
        <select id="intervalMode">
          <option value="fixed">Fixed</option>
          <option value="random" selected>Randomized</option>
        </select>
      </div>

      <div>
        <label for="intervalSeconds">Interval seconds</label>
        <input id="intervalSeconds" type="number" min="3" max="60" step="0.001" value="4.000" />
      </div>
    </div>

    <div class="row two">
      <div>
        <label for="flashDuration">Flash duration (ms)</label>
        <input id="flashDuration" type="number" step="any" value="40" inputmode="decimal" />
      </div>

      <div class="swatch">
        <label for="flashBg">Flash background</label>
        <input id="flashBg" type="color" value="#000000" />
      </div>
    </div>

    <div class="row two">
      <div class="swatch">
        <label for="flashFg">Flash text</label>
        <input id="flashFg" type="color" value="#ffffff" />
      </div>
    </div>

    <div class="small">
      The flash layer uses the current affirmation text, so updated copy is picked up while the media keeps rolling.
    </div>
  </div>
</section>

  </div>

<output id="status" class="status">Ready.</output>

</main>
