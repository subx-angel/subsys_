<!-- subpixel_1.0.5 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subpixel_1.0.5</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --accent: #888888;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #ffffff;
                --accent: #444444;
            }
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            text-transform: lowercase;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--text);
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
        }
        .val-display {
            min-width: 40px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--text);
        }
        button, .file-label {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            padding: 0;
            text-align: left;
            width: fit-content;
        }
        button:hover, .file-label:hover {
            color: var(--accent);
        }
        input[type="file"] {
            display: none;
        }
        #preview-container {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            width: 100%;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>subpixel_1.0.5</header>

    <div class="container">
        <textarea id="textInput" placeholder="Enter subliminal messages here..."></textarea>
        
        <div class="controls">
            <label class="file-label">
                [ select images ]
                <input type="file" id="fileInput" multiple accept="image/*">
            </label>

            <div class="control-group">
                <span>Obscurity:</span>
                <input type="range" id="obscurity" min="0.001" max="0.2" step="0.001" value="0.075">
                <span id="obsVal" class="val-display">0.1</span>
            </div>
            
            <div class="control-group">
                <span>Text Scale:</span>
                <input type="range" id="textScale" min="1" max="20" step="1" value="5">
                <span id="scaleVal" class="val-display">5</span>
            </div>

            <button id="generateBtn">[ generate ]</button>
            <button id="downloadBtn">[ download all ]</button>
        </div>
    </div>

    <div id="preview-container"></div>

    <script>
        const textInput = document.getElementById('textInput');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewContainer = document.getElementById('preview-container');
        const obscuritySlider = document.getElementById('obscurity');
        const scaleSlider = document.getElementById('textScale');
        const obsVal = document.getElementById('obsVal');
        const scaleVal = document.getElementById('scaleVal');

        let generatedImages = [];

        // Update value displays
        obscuritySlider.addEventListener('input', () => obsVal.textContent = obscuritySlider.value);
        scaleSlider.addEventListener('input', () => scaleVal.textContent = scaleSlider.value);

        generateBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            const text = textInput.value;
            if (!files.length || !text) return;

            previewContainer.innerHTML = '';
            generatedImages = [];

            const segments = text.split(/[.,!?;:]+/).filter(s => s.trim().length > 0);
            const opacity = parseFloat(obscuritySlider.value);
            const scaleFactor = parseInt(scaleSlider.value);

            for (let file of files) {
                const img = await loadImage(file);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const placedRects = [];

                segments.forEach(seg => {
                    const fontSize = Math.max(10, Math.floor(canvas.width / 100 * scaleFactor));
                    ctx.font = `${fontSize}px sans-serif`;
                    
                    const textWidth = ctx.measureText(seg.trim()).width;
                    const textHeight = fontSize;

                    const maxX = canvas.width - textWidth;
                    const maxY = canvas.height - textHeight;

                    let x, y;
                    let overlap = true;
                    let attempts = 0;

                    // Collision detection to prevent overlap
                    while (overlap && attempts < 100) {
                        attempts++;
                        
                        // Calculate potential center points
                        x = (textWidth > canvas.width) ? canvas.width / 2 : (Math.random() * maxX) + (textWidth / 2);
                        y = (textHeight > canvas.height) ? canvas.height / 2 : (Math.random() * maxY) + (textHeight / 2);

                        const currentRect = {
                            left: x - textWidth / 2,
                            right: x + textWidth / 2,
                            top: y - textHeight / 2,
                            bottom: y + textHeight / 2
                        };

                        overlap = placedRects.some(rect => 
                            !(currentRect.left > rect.right || 
                              currentRect.right < rect.left || 
                              currentRect.top > rect.bottom || 
                              currentRect.bottom < rect.top)
                        );
                    }

                    placedRects.push({
                        left: x - textWidth / 2,
                        right: x + textWidth / 2,
                        top: y - textHeight / 2,
                        bottom: y + textHeight / 2
                    });

                    const pixel = ctx.getImageData(x, y, 1, 1).data;
                    const brightness = (pixel[0] * 299 + pixel[1] * 587 + pixel[2] * 114) / 1000;
                    ctx.fillStyle = brightness > 128 ? `rgba(0,0,0,${opacity})` : `rgba(255,255,255,${opacity})`;
                    
                    ctx.fillText(seg.trim(), x, y);
                });

                previewContainer.appendChild(canvas);
                generatedImages.push(canvas.toDataURL('image/png'));
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (generatedImages.length === 0) return;
            
            generatedImages.forEach((dataUrl, index) => {
                const link = document.createElement('a');
                link.download = `subpixel_out_${index + 1}.png`;
                link.href = dataUrl;
                link.click();
            });
        });

        function loadImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
